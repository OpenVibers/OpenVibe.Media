# OpenVibe.Media's S3 surface (ADR-031): path style, https://s3.openvibe.media/<zone name>/<key>. Node answers every
# request whose Host is an S3 host (MEDIA_S3_HOSTS, server/s3/routes.js). proxy_pass has no URI part on purpose: nginx
# then passes the request line exactly as the client sent it, and SigV4 signs that path (a URI part would make nginx
# decode and re-encode it, and every key with an escaped character would fail its signature).
# Certificate: the openvibe.media wildcard. DNS: s3.openvibe.media is a DNS-only record (since 2026-10-21), so clients
# reach this vhost directly and an object may exceed the 100 MB a request that Cloudflare's proxy carries on this plan;
# OpenVibe.Zone names it (ZONE_S3_ENDPOINT). s3.openvibe.network (the openvibe.network wildcard name and certificate,
# behind Cloudflare) is the interim name of the same surface. MEDIA_S3_HOSTS lists both.
limit_req_zone $binary_remote_addr zone=media_s3:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name s3.openvibe.media s3.openvibe.network;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.openvibe.media;
    ssl_certificate     /etc/letsencrypt/live/openvibe.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.media/privkey.pem;

    # One PutObject carries at most MEDIA_OBJECT_MAX_MB (256 MB) of data; aws-chunked framing adds a little.
    client_max_body_size 300m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # Signed URLs carry long query strings.
    large_client_header_buffers 8 16k;

    # No path is held back: every path is a zone and a key. (Node's own /metrics answers proxied callers 404, so Zone
    # refuses the zone name `metrics`.)
    location / {
        limit_req zone=media_s3 burst=200 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Media-Shield-Host "";
        proxy_set_header X-Media-Shield-Failed "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        # Zones are private: no shared cache (Cloudflare's included) may keep an S3 answer, whatever Cache-Control an
        # object was stored with. A signed GET kept at the edge would be served to an unsigned request for the same URL.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.openvibe.network;
