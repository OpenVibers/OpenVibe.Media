# Media Fabric F1b — origin shield, http-level part (install as /etc/nginx/conf.d/media-shield.conf).
# One slice cache for B2 reads: 10 MB slices keyed by object path + slice, never by the presigned signature.
# Sizing: the cache shares the disk with recordings, so it is small and yields to them: nginx evicts when free space
# drops below 20 GB (recordings' guardian warns at 15 GB), and never holds more than 5 GB.
proxy_cache_path /var/cache/nginx/media-shield levels=1:2 keys_zone=media_shield:64m max_size=5g min_free=20g inactive=24h use_temp_path=off;

# The signed query is a bearer token: shield logs carry the path only ($uri), never $args or $request_uri.
log_format media_shield '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent cache=$upstream_cache_status range="$http_range" rt=$request_time';

# Purge (server/placement/shield.js purge): loopback only, bypasses the cache and stores the provider's answer for the
# same key (a deleted object's 404 replaces its slices, cached for a minute).
server {
    listen 127.0.0.1:8479;
    server_name _;
    access_log /var/log/nginx/media-shield.log media_shield;
    location /_media_shield_refresh/b2/ {
        # Node calls this over real HTTP, so it cannot be `internal`: only loopback may force cache writes.
        allow 127.0.0.1;
        deny all;
        rewrite ^/_media_shield_refresh/b2/(.*)$ /$1 break;
        slice 10m;
        proxy_cache media_shield;
        proxy_cache_key "b2|$uri|$slice_range";
        proxy_cache_bypass 1;
        proxy_cache_valid 200 206 24h;
        proxy_cache_valid 403 404 1m;
        include snippets/media-shield-b2-upstream.conf;
    }
    location / { return 404; }
}
