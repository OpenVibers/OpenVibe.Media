server {
    listen 80;
    listen [::]:80;
    server_name openvibe.media www.openvibe.media;
    return 301 https://openvibe.media$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openvibe.media www.openvibe.media;

    ssl_certificate     /etc/letsencrypt/live/openvibe.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.media/privkey.pem;

    client_max_body_size 4096m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
