server {
    listen 80;
    listen [::]:80;
    server_name openvibe.media www.openvibe.media;
    return 301 https://openvibe.media$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openvibe.media www.openvibe.media;

    ssl_certificate     /etc/letsencrypt/live/openvibe.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.media/privkey.pem;
    include snippets/security-txt.conf;

    client_max_body_size 4096m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # The app sends no security headers on its pages (2026-10-17: none on openvibe.media). No CSP or frame rule:
    # pictures, players and embeds here are loaded and framed by every OpenVibe site.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Prometheus metrics are for loopback scrapers only (the app 404s proxied callers too).
    location ~* ^/metrics(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only the edge host's block may say "edge" (placement/shield.js): cleared here so a client cannot send it
        # through Cloudflare; X-Forwarded-Host is cleared too (Express's req.hostname would honour it).
        proxy_set_header X-Media-Shield-Host "";
        proxy_set_header X-Media-Shield-Failed "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
