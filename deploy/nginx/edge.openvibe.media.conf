# Media Fabric F1b — the DNS-only edge host (install in sites-enabled). Viewers' bytes come from here, not through
# Cloudflare's proxy (its terms for video are not verified: plan T4). Node answers every request as on openvibe.media;
# for a public B2 copy it answers with X-Accel-Redirect into /_media_shield/b2/ and nginx serves the bytes from the
# slice cache (MEDIA_SHIELD=b2, MEDIA_SHIELD_HOST=edge.openvibe.media in /etc/openvibe/media.env).
server {
    listen 80;
    listen [::]:80;
    server_name edge.openvibe.media;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://edge.openvibe.media$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edge.openvibe.media;
    ssl_certificate     /etc/letsencrypt/live/edge.openvibe.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge.openvibe.media/privkey.pem;

    location /_media_shield/b2/ {
        internal;
        access_log /var/log/nginx/media-shield.log media_shield;
        rewrite ^/_media_shield/b2/(.*)$ /$1 break;
        slice 10m;
        proxy_cache media_shield;
        proxy_cache_key "b2|$uri|$slice_range";
        proxy_cache_valid 200 206 24h;
        proxy_cache_valid 404 1m;
        # Single flight per object + slice: N viewers of the same range cost one B2 GET.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        include snippets/media-shield-b2-upstream.conf;
    }

    # Everything else is Node, exactly as on openvibe.media (client-IP headers from $remote_addr only).
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
