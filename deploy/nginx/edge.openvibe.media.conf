# Media Fabric F1b — the DNS-only edge host (install in sites-enabled). Viewers' bytes come from here, not through
# Cloudflare's proxy (its terms for video are not verified: plan T4). Node answers every request as on openvibe.media;
# for a public B2 copy it answers with X-Accel-Redirect into /_media_shield/b2/ and nginx serves the bytes from the
# slice cache (MEDIA_SHIELD=b2, MEDIA_SHIELD_HOST=edge.openvibe.media in /etc/openvibe/media.env).
server {
    listen 80;
    listen [::]:80;
    server_name edge.openvibe.media;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://edge.openvibe.media$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edge.openvibe.media;
    ssl_certificate     /etc/letsencrypt/live/edge.openvibe.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge.openvibe.media/privkey.pem;

    # As on openvibe.media: large uploads, long Node responses (DVR, recordings, SSE).
    client_max_body_size 4096m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Prometheus metrics are for loopback scrapers only (the app 404s proxied callers too).
    location = /metrics { return 404; }

    location /_media_shield/b2/ {
        internal;
        access_log /var/log/nginx/media-shield.log media_shield;
        rewrite ^/_media_shield/b2/(.*)$ /$1 break;
        slice 10m;
        proxy_cache media_shield;
        proxy_cache_key "b2|$uri|$slice_range";
        proxy_cache_valid 200 206 24h;
        proxy_cache_valid 404 1m;
        # Single flight per object + slice: N viewers of the same range cost one B2 GET.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Node's answer owns the viewer-facing headers (Content-Type, Content-Disposition, Cache-Control survive the
        # X-Accel redirect): B2's copies, and its request ids, are dropped. The security headers Node sets do not survive
        # the redirect, so they are set here.
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag noindex always;
        add_header X-Cache-Status $upstream_cache_status always;
        include snippets/media-shield-b2-upstream.conf;
    }

    # Everything else is Node, exactly as on openvibe.media (client-IP headers from $remote_addr only), plus the one
    # header that tells Node this is the edge: nginx sets it from its own server name, so a client cannot forge it.
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Media-Shield-Host $server_name;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
