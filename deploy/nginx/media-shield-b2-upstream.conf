# Media Fabric F1b — how the shield reaches B2 (install as /etc/nginx/snippets/media-shield-b2-upstream.conf).
# B2 is addressed path-style, so every presigned URL is signed for this one host (SigV4 signs the Host header). It must
# equal server/placement/shield.js B2_UPSTREAM_HOST (test/placement-shield.test.js pins both) and the host of
# MEDIA_B2_ENDPOINT: a URL signed for any other host is never sent here (Node keeps its 302).
proxy_set_header Range $slice_range;
proxy_set_header If-Range "";
proxy_set_header Host s3.us-west-004.backblazeb2.com;
proxy_set_header Connection "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name s3.us-west-004.backblazeb2.com;
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_pass https://s3.us-west-004.backblazeb2.com;
